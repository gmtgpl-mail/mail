w ciągu najbliższych kilku dni na Państwa targach swoje stoiska rozłoży dziewiętnaście izraelskich firm zbrojeniowych – dwa razy więcej niż w roku ubiegłym. W ubiegłym roku było to skandalem. W tym roku jest to hańbą.

Targi w Kielcach stają się narzędziem politycznej normalizacji i legitymizacji Izraela na arenie międzynarodowej – goszczą państwowe koncerny, takie jak Rafael Advanced Defense Systems, Israel Aerospace Industries (IAI) oraz SCD - SEMI CONDUCTOR DEVICES, (spółkę-córkę Elbit Systems, czyli głównego dostawcy sprzętu dla izraelskich sił okupacyjnych). To firmy, które dostarczają narzędzia do ludobójstwa w Strefie Gazy i testują swoją broń na ludności cywilnej, by potem reklamować ją jako „sprawdzoną w boju". To nie jest zwykły handel – to współudział w zbrodni.


Sprzeciwiamy się temu nie tylko z moralnego obowiązku, ale przede wszystkim z powodu zobowiązań prawnych Polski. Jeśli MSPO nie odstąpi od promowania izraelskich firm, sprawa nieuchronnie może znaleźć swój finał przed Międzynarodowym Trybunałem Sprawiedliwości w Hadze.

Polska jest państwem frontowym, zagrożonym przez Rosję. Naszym najważniejszym orężem w obliczu tego zagrożenia jest wiarygodność – jako państwa prawa, sojusznika i orędownika międzynarodowego ładu. Jeśli w obliczu ludobójstwa w Gazie odwracamy wzrok, promujemy zbrodniarzy i nagradzamy ich kontraktami, podkopujemy własne argumenty wobec Putina. Na targach MSPO słusznie nie ma miejsca dla rosyjskich firm – oczekujemy tej samej konsekwencji wobec Izraela.


Przy użyciu technologii izraelskich firm, które Państwo goszczą w kieleckich halach, zamordowano polskiego wolontariusza Damiana Sobóla i sześcioro jego towarzyszy. Domagamy się sprawiedliwości dla niego i wszystkich ofiar w Strefie Gazy – ich pamięć zobowiązuje, a bezkarność sprawców musi się skończyć.

Nie pozwolimy, by nasze miasto i nasz kraj stały się wizytówką dla ludobójców.
