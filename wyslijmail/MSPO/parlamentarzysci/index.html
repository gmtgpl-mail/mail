w ciągu najbliższych kilku dni na kieleckich targach swoje stoiska rozłoży dziewiętnaście izraelskich firm zbrojeniowych – dwa razy więcej niż w roku ubiegłym. W ubiegłym roku było to skandalem. W tym roku jest to hańbą.

Targi w Kielcach stają się narzędziem politycznej normalizacji i legitymizacji Izraela na arenie międzynarodowej – goszczą państwowe koncerny, takie jak Rafael [1] Advanced Defense Systems, Israel Aerospace Industries (IAI) [2] oraz SCD - SEMI CONDUCTOR DEVICES, (spółkę-córkę Elbit Systems, czyli głównego dostawcy sprzętu dla izraelskich sił okupacyjnych) [3]. To firmy, które dostarczają narzędzia do ludobójstwa w Strefie Gazy i testują swoją broń na ludności cywilnej, by potem reklamować ją jako „sprawdzoną w boju". To nie jest zwykły handel – to współudział w zbrodni.


Sprzeciwiamy się temu nie tylko z moralnego obowiązku, ale przede wszystkim z powodu zobowiązań prawnych Polski. Jeśli MSPO nie odstąpi od promowania izraelskich firm, sprawa nieuchronnie może znaleźć swój finał przed Międzynarodowym Trybunałem Sprawiedliwości w Hadze.

Polska jest państwem frontowym, zagrożonym przez Rosję. Naszym najważniejszym orężem w obliczu tego zagrożenia jest wiarygodność – jako państwa prawa, sojusznika i orędownika międzynarodowego ładu. Jeśli w obliczu ludobójstwa w Gazie odwracamy wzrok, promujemy zbrodniarzy i nagradzamy ich kontraktami, podkopujemy własne argumenty wobec Putina. Na targach MSPO słusznie nie ma miejsca dla rosyjskich firm – oczekujemy tej samej konsekwencji wobec Izraela.


Przy użyciu technologii izraelskich firm, które Państwo goszczą w kieleckich halach, zamordowano polskiego wolontariusza Damiana Sobóla i sześcioro jego towarzyszy. Domagamy się sprawiedliwości dla niego i wszystkich ofiar w Strefie Gazy – ich pamięć zobowiązuje, a bezkarność sprawców musi się skończyć.


Dlatego żądamy:

    Całkowitego zakazu wstępu i udziału dla oficjalnych delegacji izraelskich, przedstawicieli izraelskich władz politycznych, wojskowych oraz przemysłu zbrojeniowego, a także osób fizycznych i prawnych pełniących rolę pośredników na rzecz tych podmiotów.

    Całkowitego zakazu prezentacji i marketingu izraelskiej broni i technologii wojskowych, w tym zakaz używania znaków towarowych, logo i symboli izraelskich firm zbrojeniowych na terenie targów i w komunikacji zewnętrznej

    Wprowadzenia jawnego mechanizmu weryfikacji wystawców pod kątem zgodności z prawem międzynarodowym, prawem humanitarnym i obowiązkami należytej staranności (due diligence).

[Pełna treść apelu: https://nomada.info.pl/apel-o-wykluczenie-izraelskich-firm-z-targow-zbrojeniowych-w-kielcach]


Targi w Kielcach, objęte Honorowym Patronatem Prezydenta RP, nie mogą być platformą promocji dla technologii służących ludobójstwu. W Polsce i w Kielcach nie ma miejsca dla zbrodniarzy wojennych – bez względu na to, z którego kraju pochodzą.

Nie pozwolimy, by nasze miasto i nasz kraj stały się wizytówką dla ludobójców.
