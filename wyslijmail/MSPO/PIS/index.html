Polska racja stanu wymaga dziś jasnego głosu. Jako parlamentarzyści największej partii opozycyjnej, która wsparła Karola Nawrockiego w drodze do Pałacu Prezydenckiego, mają Państwo nie tylko prawo, ale i obowiązek – wobec polskiego honoru i pamięci o polskim bohaterze – stanowczo postawić granicę i pokazać naszą siłę.

Na tegorocznych targach MSPO w Kielcach swoje stoiska rozkłada dziewiętnaście izraelskich firm zbrojeniowych – dwa razy więcej niż rok temu. Wśród nich Rafael [1], IAI [2] oraz SCD – spółka-córka Elbit Systems [3], głównego dostawcy sprzętu dla izraelskich sił okupacyjnych. To firmy, które dostarczają narzędzia do ludobójstwa w Strefie Gazy i testują swoją broń na ludności cywilnej, by potem reklamować ją jako „sprawdzoną w boju”.



Przy użyciu technologii tych właśnie firm zamordowano polskiego wolontariusza Damiana Sobóla i sześcioro jego współpracowników z World Central Kitchen [4]. Pociągnięcie sprawców do odpowiedzialności to dziś sprawdzian polskiego honoru i twardy fundament bezpieczeństwa naszych rodaków na całym świecie. Skończyły się czasy, gdy Polska była przedpokojem dla obcych mocarstw. Nasza suwerenność nie podlega negocjacjom, a polski honor nie jest i nigdy nie będzie na sprzedaż.

Dlatego żądamy:

    Całkowitego zakazu wstępu i udziału dla oficjalnych delegacji izraelskich, przedstawicieli izraelskich władz politycznych, wojskowych oraz przemysłu zbrojeniowego, a także osób fizycznych i prawnych pełniących rolę pośredników na rzecz tych podmiotów.

    Całkowitego zakazu udziału dla wszystkich firm zarejestrowanych w Izraelu oraz podmiotów powiązanych z izraelskim przemysłem zbrojeniowym (w tym spółek zależnych, joint venture, podwykonawców i współwykonawców).

    Całkowitego zakazu prezentacji i marketingu izraelskiej broni i technologii wojskowych, w tym zakaz używania znaków towarowych, logo i symboli izraelskich firm zbrojeniowych na terenie targów i w komunikacji zewnętrznej

    Wprowadzenia jawnego mechanizmu weryfikacji wystawców pod kątem zgodności z prawem międzynarodowym, prawem humanitarnym i obowiązkami należytej staranności (due diligence).

[Pełna treść apelu: https://nomada.info.pl/apel-o-wykluczenie-izraelskich-firm-z-targow-zbrojeniowych-w-kielcach]


Sprzeciwiamy się temu nie tylko z moralnego obowiązku, ale przede wszystkim z powodu umocowań prawnych Polski. Jeśli MSPO nie odstąpi od promowania izraelskich firm, sprawa nieuchronnie może znaleźć swój finał przed Międzynarodowym Trybunałem Sprawiedliwości w Hadze.

Prezydent Karol Nawrocki mówił na forum ONZ: „Musimy zbudować międzynarodowy system odpowiedzialności, który nie zawaha się nazywać zła po imieniu, bez względu na to, jaką flagę nosi na ramieniu. Musimy jasno powiedzieć, że istnieją granice, istnieją prawa człowieka, istnieje prawo międzynarodowe, a każdy, kto je łamie, powinien ponieść surowe konsekwencje”. Dziś to prawo zostało pogwałcone. Śledztwo w sprawie zabójstwa polskiego obywatela zostało umorzone. Sprawcy pozostają bezkarni. A polskie targi zbrojeniowe – pod honorowym patronatem najwyższego zwierzchnika Sił Zbrojnych RP  – stają się platformą promocji dla ich pracodawców.

Polska jest państwem frontowym, zagrożonym przez Rosję. Naszym najważniejszym orężem w obliczu tego zagrożenia jest wiarygodność – jako państwa prawa, sojusznika i orędownika międzynarodowego ładu. Jeśli w obliczu ludobójstwa w Gazie odwracamy wzrok, promujemy zbrodniarzy i nagradzamy ich kontraktami, podkopujemy własne argumenty wobec Putina. Na targach MSPO słusznie nie ma miejsca dla rosyjskich firm – oczekujemy tej samej konsekwencji wobec Izraela.



Damian Soból z Przemyśla zginął, niosąc pomoc głodującym cywilom w Strefie Gazy. Domagamy się sprawiedliwości dla niego oraz wszystkich ofiar izraelskiej okupacji. Pamięć o nich zobowiązuje nas do działania, a bezkarność sprawców musi się zakończyć. Nie pozwólmy, by polska flaga otaczała patronatem tych, którzy mają na rękach krew naszych rodaków.

W Polsce i w Kielcach nie ma miejsca dla zbrodniarzy wojennych – bez względu na to, z którego kraju pochodzą.
